services:
  mysql:
    image: mysql:8
    container_name: bank2_mercantil_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: banco_mercantil
    ports:
      - "3306:3306"
    volumes:
      - mysql_bank_data:/var/lib/mysql

  postgres:
    image: postgres:16
    container_name: bank3_bnb_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: banco_bnb
    ports:
      # 5433 en el host para no chocar con PostgreSQL local del sistema (5432)
      - "5433:5432"
    volumes:
      - postgres_bank_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: bank4_bcp_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_bank_data:/data/db

volumes:
  mysql_bank_data:
  postgres_bank_data:
  mongo_bank_data:
